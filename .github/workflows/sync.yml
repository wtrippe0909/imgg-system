name: Sync Bandcamp

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:
    inputs:
      project:
        description: "Only sync this project id (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: sync-bandcamp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Bandcamp pages
        # A failure for one project should not block the others or the commit.
        continue-on-error: true
        run: node scripts/fetch-bandcamp.mjs ${{ inputs.project }}
      - name: Audit
        run: node scripts/audit.mjs
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json AUDIT.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync Bandcamp data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Announce new releases
        if: steps.commit.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE: ${{ secrets.AIRTABLE_TABLE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node scripts/notify.mjs
